server:
  port: ${SERVER_PORT}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  application:
    name: core-services

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'none' porque la base de datos ya fue estructurada manualmente con el script SQL
      ddl-auto: none

    # Útil para que los devs vean en la consola las consultas que Spring ejecuta por detrás
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuración de logs para ver los errores con mayor claridad (Opcional pero recomendado)
logging:
  level:
    com.vincu.core_services: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.orm.jdbc.bind: OFF
